name: Lynx Textra CI Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "public/**"
      - "src/**"
      - "demos/**"
      - "test/**"
      - "examples/**"
      - "platform/**"
      - "BUILD.gn"

jobs:
  macos-build-check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run MacOS Debug build check
        run: |
          source tools/envsetup.sh
          gn gen out/macos_debug --args='is_debug=true use_flutter_cxx=false'
          ninja -C out/macos_debug lynxtextra
      - name: Run MacOS Release build check
        run: |
          source tools/envsetup.sh
          gn gen out/macos_release --args='is_debug=false use_flutter_cxx=false'
          ninja -C out/macos_release lynxtextra
      - name: Run macOS example build check
        run: |
          source tools/envsetup.sh
          buildtools/cmake/bin/cmake -DCMAKE_BUILD_TYPE=Release -DSKITY_MTL_BACKEND=ON -G Ninja -S . -B cmake-build-release
          buildtools/cmake/bin/cmake --build cmake-build-release -t mtl_app_demo

  macos-unittest-check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          lfs: true
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run macOS build check - mtl_app_demo
        run: |
          source tools/envsetup.sh
          buildtools/cmake/bin/cmake -DCMAKE_BUILD_TYPE=Release -DSKITY_MTL_BACKEND=OFF -G Ninja -S . -B cmake-build-test
          buildtools/cmake/bin/cmake --build cmake-build-test -t TextLayoutLiteTest
      - name: Run Unittests
        run: |
          mkdir golden_check
          pushd golden_check
          ../cmake-build-test/test/TextLayoutLiteTest
          popd
      - name: Run e2e check
        run: |
          source tools/envsetup.sh
          which python3
          python3 test/compare_images.py --actual-dir=golden_check --golden-dir=test/golden_images

  android-example-build-check:
    runs-on: lynx-ubuntu-22.04-large
    timeout-minutes: 60
    steps:
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Install Android SDK CMake
        run: |
          source tools/envsetup.sh
          pushd demos/android
          echo $ANDROID_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager --sdk_root=$ANDROID_HOME --install "cmake;3.18.1"
          ./gradlew :app:assembleRelease
          ./gradlew :perftest:assembleRelease
          ./gradlew :skitydemo:assembleDebug
          popd

  ios-example-build-check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run iOS build check
        run: |
          source tools/envsetup.sh
          pushd demos/darwin/ios/TextlayoutDemo
          source bundle_install.sh
          xcodebuild -workspace TextlayoutDemo.xcworkspace -scheme LynxTextraDemo -configuration Release -arch arm64 -sdk iphoneos SYMROOT=$(pwd)/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          xcodebuild -workspace TextlayoutDemo.xcworkspace -scheme TextlayoutDemo -configuration Release -arch arm64 -sdk iphoneos SYMROOT=$(pwd)/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  linux-skia-demo-build-check:
    runs-on: lynx-ubuntu-22.04-large
    timeout-minutes: 60
    steps:
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run Skia demo build check
        run: |
          source tools/envsetup.sh
          # source tools/fetch_and_build_skia.sh
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=x64
          buildtools/cmake/bin/cmake -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DTEXTRA_ENABLE_SKIA=ON -G Ninja -S . -B cmake-build-release
          buildtools/cmake/bin/cmake --build cmake-build-release -t ttreaderdemo

  build-harmony:
    name: Build HarmonyOS
    runs-on: lynx-custom-container
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:bf493c3710de3c44bfa84caf402c0727b9310c42497f6e52580ad441ea640ef1
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps

      - name: Install dependencies and Build
        shell: bash
        run: |
          source tools/envsetup.sh
          pushd demos/harmony/lynxtextra_demo
          ohpm install
          hvigorw assembleApp --mode project -p product=default -p buildMode=debug --no-daemon

  lvgl-demo-build-check:
    runs-on: lynx-ubuntu-22.04-large
    timeout-minutes: 60
    steps:
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run LVGL demo build check
        run: |
          source tools/envsetup.sh
          ./tools/hab sync . --target=lvgl
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=x64
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          buildtools/cmake/bin/cmake -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DIS_LVGL=ON -G Ninja -S . -B cmake-build-release
          buildtools/cmake/bin/cmake --build cmake-build-release -t lvgl_demo
