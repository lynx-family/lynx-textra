name: Lynx Textra CI
permissions:
  contents: read
"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - public/**
      - src/**
      - demos/**
      - test/**
      - examples/**
      - platform/**
      - BUILD.gn
      - DEPS
      - .habitat
      - hab.ci/**
      - cmake/**
      - CMakeLists.txt
      - tools/ci/habitat_cache_helper.py
      - .gn
      - config.gni
      - patches/**
  workflow_dispatch:
    inputs:
      baseline:
        description: Full baseline commit SHA
        required: true
        type: string
      platform:
        description: Native CI platform (Harmony builds only)
        type: choice
        default: all
        options:
          - all
          - macos
          - android
          - ios
          - harmony
          - windows
concurrency:
  group: textra-ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  protocol-tests:
    name: Performance Harness / Tests
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 -m unittest discover -s test/perf -p 'test_*.py'
      - run: python3 -m unittest discover -s test/size -p 'test_*.py'
      - name: Select performance coverage
        id: impact
        run: |-
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              enabled = True
          else:
              files = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASELINE'], os.environ['CANDIDATE']], text=True).splitlines()
              roots = ('public/', 'src/', 'platform/', 'test/perf/', 'patches/', '.github/actions/')
              fixed = {'DEPS', 'BUILD.gn', 'config.gni', '.gn', '.github/workflows/ci.yml', '.github/workflows/performance.yml'}
              enabled = any(path.startswith(roots) or path in fixed for path in files)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('performance=' + str(enabled).lower() + '\n')
          PYTHON
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      performance: ${{ steps.impact.outputs.performance }}
  macos:
    name: macOS / Build, Tests & Performance
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: protocol-tests
    runs-on: lynx-darwin-15.6.1-medium
    timeout-minutes: 90
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ env.CANDIDATE }}
      - uses: ./.github/actions/common-deps
      - name: Install native CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/perf-cmake"
          "$RUNNER_TEMP/perf-cmake/bin/python" -m pip install cmake==3.31.6
          echo "$RUNNER_TEMP/perf-cmake/bin" >> "$GITHUB_PATH"
      - name: Run MacOS Debug build check
        run: |
          source tools/envsetup.sh
          gn gen out/macos_debug --args='is_debug=true use_flutter_cxx=false'
          ninja -C out/macos_debug lynxtextra
        if: github.event_name == 'pull_request'
      - name: Build Release library and C API tests once
        run: |-
          source tools/envsetup.sh
          python3 -m unittest discover -s test/capi -p 'test_*.py'
          gn gen out/macos_release --args='is_debug=false use_flutter_cxx=false'
          ninja -C out/macos_release lynxtextra backend_test capi_test
          (cd out/macos_release && ./backend_test && ./capi_test)
        if: github.event_name == 'pull_request'
      - name: Build shared demo, test and Skity artifacts
        run: |-
          export PATH="$GITHUB_WORKSPACE/buildtools/gn:$GITHUB_WORKSPACE/buildtools/ninja:$PATH"
          target_arch="$(python3 -c 'import platform; print(platform.machine())')"
          export CFLAGS="-arch $target_arch" CXXFLAGS="-arch $target_arch" LDFLAGS="-arch $target_arch"
          tools/hab sync . --target-only --target skity-macos
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$target_arch" -G Ninja -S . -B cmake-build-ci
            cmake --build cmake-build-ci --target mtl_app_demo TextLayoutLiteTest
          fi
      - name: Run Unittests
        run: |
          mkdir golden_check
          pushd golden_check
          ../cmake-build-ci/test/TextLayoutLiteTest
          popd
        if: github.event_name == 'pull_request'
      - name: Run e2e check
        run: |
          source tools/envsetup.sh
          which python3
          python3 test/compare_images.py --actual-dir=golden_check --golden-dir=test/golden_images
        if: github.event_name == 'pull_request'
      - name: Compare CoreText and SkShaper using one engine pair
        run:
          python3 test/perf/run_macos.py --baseline "$BASELINE" --candidate "$CANDIDATE" --backend both --skity-framework third_party/skity_release/apple/skity.xcframework/macos-arm64_x86_64
          --fonts test/perf/fonts.macos.json --output "$RUNNER_TEMP/textra-perf-macos"
        if: needs.protocol-tests.outputs.performance == 'true'
      - name: Compare Release package size (advisory)
        id: package-size
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python3 test/size/run.py --platform macos --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/textra-size-macos"
      - name: Publish package size summary
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ steps.package-size.outcome }}" != 'success' ]; then
            echo '::warning::Package size comparison did not complete successfully; this advisory does not gate CI.'
          fi
          report="$RUNNER_TEMP/textra-size-macos/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload package size artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: package-size-macos
          path: |-
            ${{ runner.temp }}/textra-size-macos/report.json
            ${{ runner.temp }}/textra-size-macos/summary.md
            ${{ runner.temp }}/textra-size-macos/*-build/**/*.aar
            ${{ runner.temp }}/textra-size-macos/*-build/**/*.dylib
            ${{ runner.temp }}/textra-size-macos/*-build/**/*.dll
            ${{ runner.temp }}/textra-size-macos/*-build/**/build.json
          retention-days: 14
      - name: Publish performance summaries
        if: always()
        run: |-
          for backend in macos skity; do
            report="$RUNNER_TEMP/textra-perf-macos/results/$backend/summary.md"
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-macos
          path: |-
            ${{ runner.temp }}/textra-perf-macos/results
            ${{ runner.temp }}/textra-perf-macos/config*.json
            ${{ runner.temp }}/textra-perf-macos/*.metadata.json
            ${{ runner.temp }}/textra-perf-macos/*.build.json
            ${{ runner.temp }}/textra-perf-macos/baseline
            ${{ runner.temp }}/textra-perf-macos/candidate
          retention-days: 14
  android:
    name: Android (Emulator) / Build & Performance
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'android'
    needs: protocol-tests
    runs-on: lynx-ubuntu-22.04-physical-medium
    timeout-minutes: 90
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE }}
      - name: Python Setup
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 17
          distribution: zulu
      - uses: ./.github/actions/common-deps
      - name: Install Android build tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            sdk_root="$(dirname "$(dirname "$(readlink -f "$(command -v adb)")")")"
          fi
          test -d "$sdk_root/platform-tools"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$sdk_root" --install "cmake;3.18.1" "platform-tools" "platforms;android-29" "build-tools;30.0.2" "platforms;android-35" "build-tools;35.0.0" "ndk;21.1.6352462"
      - name: Start the existing Lynx runner AVD on an owned port
        run: python3 test/perf/android_emulator.py start --state "$RUNNER_TEMP/textra-perf-emulator.json"
      - name: Use JDK 11 for legacy Android Gradle plugin
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 11
          distribution: zulu
      - name: Build demos for the selected emulator ABI
        run: |-
          source tools/envsetup.sh
          abi="$($ANDROID_HOME/platform-tools/adb -s "$ANDROID_SERIAL" shell getprop ro.product.cpu.abi | tr -d '\r')"
          tools/hab sync . --target-only --target skity-android
          pushd demos/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease :perftest:assembleRelease :skitydemo:assembleDebug -PabiList="$abi" --no-daemon
          popd
        if: github.event_name == 'pull_request'
      - name: Compare native Android on the same emulator
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 test/perf/run_platform.py --platform android --device "$ANDROID_SERIAL" --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/textra-perf-android"
        if: needs.protocol-tests.outputs.performance == 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      - name: Stop the owned emulator
        if: always()
        run: python3 test/perf/android_emulator.py stop --state "$RUNNER_TEMP/textra-perf-emulator.json"
      - name: Compare Release package size (advisory)
        id: package-size
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 40
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 test/size/run.py --platform android --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/textra-size-android"
      - name: Publish package size summary
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ steps.package-size.outcome }}" != 'success' ]; then
            echo '::warning::Package size comparison did not complete successfully; this advisory does not gate CI.'
          fi
          report="$RUNNER_TEMP/textra-size-android/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload package size artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: package-size-android
          path: |-
            ${{ runner.temp }}/textra-size-android/report.json
            ${{ runner.temp }}/textra-size-android/summary.md
            ${{ runner.temp }}/textra-size-android/*-build/**/*.aar
            ${{ runner.temp }}/textra-size-android/*-build/**/*.dylib
            ${{ runner.temp }}/textra-size-android/*-build/**/*.dll
            ${{ runner.temp }}/textra-size-android/*-build/**/build.json
          retention-days: 14
      - name: Publish paired performance summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/textra-perf-android/results/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-android
          path: |
            ${{ runner.temp }}/textra-perf-android/results
            ${{ runner.temp }}/textra-perf-android/config.json
            ${{ runner.temp }}/textra-perf-android/*.metadata.json
            ${{ runner.temp }}/textra-perf-android/*.apk
            ${{ runner.temp }}/textra-perf-android/*.zip
            ${{ runner.temp }}/textra-perf-android/*-build/perf-build.json
            ${{ runner.temp }}/textra-perf-android/build-only.json
          retention-days: 14
  ios:
    name: iOS (Simulator) / Build & Performance
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'ios'
    needs: protocol-tests
    runs-on: lynx-darwin-15.6.1-medium
    timeout-minutes: 90
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE }}
      - uses: ./.github/actions/common-deps
      - name: Install Ruby dependencies
        working-directory: demos/darwin/ios/TextlayoutDemo
        run: bundle install
        if: github.event_name == 'pull_request'
      - name: Build both demos for iOS Simulator
        run: |-
          source tools/envsetup.sh
          pushd demos/darwin/ios/TextlayoutDemo
          source bundle_install.sh
          sim_arch="$(uname -m)"
          for scheme in LynxTextraDemo TextlayoutDemo; do
            xcodebuild -workspace TextlayoutDemo.xcworkspace -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' SYMROOT="$(pwd)/build" ARCHS="$sim_arch" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
          done
          popd
        if: github.event_name == 'pull_request'
      - name: Compare native iOS on one owned simulator
        run: |
          python3 test/perf/run_platform.py --platform ios --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/textra-perf-ios"
        if: needs.protocol-tests.outputs.performance == 'true'
      - name: Publish paired performance summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/textra-perf-ios/results/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-ios
          path: |
            ${{ runner.temp }}/textra-perf-ios/results
            ${{ runner.temp }}/textra-perf-ios/config.json
            ${{ runner.temp }}/textra-perf-ios/*.metadata.json
            ${{ runner.temp }}/textra-perf-ios/*.apk
            ${{ runner.temp }}/textra-perf-ios/*.zip
            ${{ runner.temp }}/textra-perf-ios/*-build/perf-build.json
            ${{ runner.temp }}/textra-perf-ios/build-only.json
          retention-days: 14
  harmony:
    name: Harmony / Build Only
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'harmony'
    needs: protocol-tests
    runs-on: lynx-custom-container
    timeout-minutes: 90
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:da3d7313011f5f0e63a118197d15c005617cf3147282e77b1cd30402dcd142ac
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE }}
          fetch-tags: true
      - uses: ./.github/actions/common-deps
      - name: Install dependencies and Build
        shell: bash
        run: |
          source tools/envsetup.sh
          pushd demos/harmony/lynxtextra_demo
          ohpm install
          hvigorw assembleApp --mode project -p product=default -p buildMode=debug --no-daemon
        if: github.event_name == 'pull_request'
      - name: Build both Harmony benchmark NAPI hosts
        run: |
          source tools/envsetup.sh
          python3 test/perf/run_platform.py --platform harmony --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/textra-perf-harmony"
        if: needs.protocol-tests.outputs.performance == 'true'
      - name: Report build-only scope
        run:
          echo 'Harmony benchmark hosts built. Runtime performance is NOT measured because the referenced Lynx runner has
          no device pool.' >> "$GITHUB_STEP_SUMMARY"
        if: needs.protocol-tests.outputs.performance == 'true'
      - name: Publish paired performance summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/textra-perf-harmony/results/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-harmony
          path: |
            ${{ runner.temp }}/textra-perf-harmony/results
            ${{ runner.temp }}/textra-perf-harmony/config.json
            ${{ runner.temp }}/textra-perf-harmony/*.metadata.json
            ${{ runner.temp }}/textra-perf-harmony/*.apk
            ${{ runner.temp }}/textra-perf-harmony/*.zip
            ${{ runner.temp }}/textra-perf-harmony/*-build/perf-build.json
            ${{ runner.temp }}/textra-perf-harmony/build-only.json
            ${{ runner.temp }}/textra-perf-harmony/*-build/libperf_host.so
          retention-days: 14
  windows:
    name: Windows / Build
    if: github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: protocol-tests
    runs-on: lynx-windows-2022-large
    timeout-minutes: 60
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
    steps:
      - name: Install pinned Git LFS for checkout
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "git-lfs.zip"
          Invoke-WebRequest "https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-windows-amd64-v3.7.1.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "8683cdc3d6c029b49393dcebbaa6265bd6efd9abdcf837be855b4cd42e5e80b6") { throw "Git LFS checksum mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "git-lfs"
          Expand-Archive $archive -DestinationPath $destination
          $binary = Get-ChildItem $destination -Recurse -Filter git-lfs.exe | Select-Object -First 1
          if (-not $binary) { throw "Git LFS executable missing" }
          $binary.DirectoryName >> $env:GITHUB_PATH
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ env.CANDIDATE }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Configure the Lynx Windows toolchain
        shell: pwsh
        run: |
          "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          "vs2022_install=${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools" >> $env:GITHUB_ENV
          "GYP_MSVS_OVERRIDE_PATH=${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools" >> $env:GITHUB_ENV
          "WINDOWSSDKDIR=${env:ProgramFiles(x86)}\Windows Kits\10" >> $env:GITHUB_ENV
      - name: Sync dependencies with native Windows Habitat
        shell: pwsh
        env:
          HABITAT_CONCURRENCY: 2
        run: |
          python -m pip install PyYAML requests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $habitat = Join-Path $env:RUNNER_TEMP "hab.exe"
          Invoke-WebRequest "https://github.com/lynx-family/habitat/releases/download/0.3.151/hab.exe" -OutFile $habitat
          if ((Get-FileHash $habitat -Algorithm SHA256).Hash -ne "f40aa7efe0a92c6e536f6f9d0d7220e2a8d2c0e6326b262c40c0c08c2f3c3a0e") { throw "Habitat checksum mismatch" }
          & $habitat sync . --target windows-ci --target-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\buildtools\ninja" >> $env:GITHUB_PATH
      - name: Build Windows Release core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/windows_release | Out-Null
          @(
            'target_os = "win"'
            'target_cpu = "x64"'
            'is_debug = false'
            'use_flutter_cxx = false'
            'is_clang = true'
            'dynamic_load_harfbuzz = false'
          ) | Set-Content out/windows_release/args.gn -Encoding ascii
          & .\buildtools\gn\gn.exe gen out/windows_release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\buildtools\ninja\ninja.exe -C out/windows_release obj/src/capi.stamp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report Windows performance coverage
        shell: pwsh
        run: |
          'Windows performance checks are temporarily disabled until a Skity binary SDK is available. The Release core compile check and advisory package-size comparison remain enabled.' >> $env:GITHUB_STEP_SUMMARY
      - name: Compare Release package size (advisory)
        id: package-size
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 40
        shell: pwsh
        run: |
          python test/size/run.py --platform windows --baseline $env:BASELINE --candidate $env:CANDIDATE --output "$env:RUNNER_TEMP/textra-size-windows"
      - name: Publish package size summary
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ steps.package-size.outcome }}" != 'success' ]; then
            echo '::warning::Package size comparison did not complete successfully; this advisory does not gate CI.'
          fi
          report="$RUNNER_TEMP/textra-size-windows/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload package size artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
