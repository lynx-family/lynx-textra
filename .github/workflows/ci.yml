          cmake-build-release/demos/darwin/macos/ttreaderdemo/SkiaPrebuiltSmoke fonts/Inter/Inter-VariableFont_opsz,wght.ttf skia-smoke.png
          cmake-build-release/test/GradientSkiaTest
          cmake-build-release/test/SkiaHeaderOnlyTest fonts/Inter/Inter-VariableFont_opsz,wght.ttf
    if: github.event_name == 'pull_request'
    needs: protocol-tests
  linux-lvgl:
    name: Linux (LVGL) / Build
